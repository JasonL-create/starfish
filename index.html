<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Still — To-do Prototype</title>
<style>
  :root{
    --bg:#f8f8f6;
    --surface:#ffffff;
    --text:#252724;
    --muted:#7a7e78;
    --line:#e8e9e5;
    --line-strong:#d8dad5;
    --accent:#5f7468;
    --accent-soft:#eef2ef;
    --shadow:0 10px 35px rgba(35,40,36,.05);
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height:1.4;
  }
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:980px;margin:0 auto;padding:44px 26px 80px}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
  .brand h1{margin:0;font-size:30px;font-weight:650;letter-spacing:-.03em}
  .brand p{margin:5px 0 0;color:var(--muted);font-size:14px}
  .search-wrap{width:min(390px,46vw);position:relative}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
  .search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px 11px 40px;outline:none;color:var(--text)}
  .search:focus,.new-task-input:focus,.subtask-input:focus,.date-input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(95,116,104,.08)}
  .composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;display:flex;gap:10px;box-shadow:var(--shadow);margin-bottom:22px}
  .new-task-input{flex:1;border:0;outline:0;padding:8px 10px;font-size:17px;background:transparent}
  .add-btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:10px 18px;font-weight:600}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 2px 18px}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tool-select{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 32px 8px 10px;outline:none;max-width:180px}
  .count{font-size:13px;color:var(--muted);margin-right:5px}
  .tasks{display:flex;flex-direction:column;gap:10px}
  .task-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:0 2px 12px rgba(35,40,36,.025)}
  .task-card.search-completed{opacity:.82}
  .task-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
  .check{appearance:none;width:21px;height:21px;border:1.5px solid #b7bbb4;border-radius:6px;margin:2px 0 0;display:grid;place-content:center;background:#fff;transition:.15s}
  .check:checked{background:var(--accent);border-color:var(--accent)}
  .check:checked::after{content:"";width:8px;height:4px;border:2px solid white;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
  .task-title{font-size:16px;font-weight:540;word-break:break-word;min-width:0}
  .task-title.done{text-decoration:none;color:#8f948f}
  .created{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:2px}
  .meta{margin:12px 0 0 33px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .meta-btn,.quiet-btn,.category-select{border:1px solid var(--line);background:#fbfbfa;color:#686d67;border-radius:9px;padding:6px 9px;font-size:12px}
  .meta-btn:hover,.quiet-btn:hover{border-color:var(--line-strong)}
  .due-chip{display:flex;align-items:center;gap:6px}
  .date-input{border:1px solid var(--line);background:#fbfbfa;color:#686d67;border-radius:9px;padding:5px 8px;font-size:12px;max-width:145px;outline:none}
  .due-label{color:var(--muted);font-size:12px}
  .subtasks{margin:15px 0 0 33px;border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:9px}
  .subtask{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:26px}
  .subtask .check{width:18px;height:18px;border-radius:5px;margin:0}
  .subtask-title{font-size:14px;color:#454944}
  .subtask-title.done{text-decoration:line-through;color:#9a9e98}
  .tiny-time{font-size:11px;color:#a0a49e;white-space:nowrap}
  .subtask-composer{margin-top:2px;display:flex;gap:7px}
  .subtask-input{min-width:0;flex:1;border:1px solid var(--line);background:#fbfbfa;border-radius:9px;padding:7px 9px;outline:none;font-size:13px}
  .subtask-add{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12px;padding:6px}
  .hide-prompt{margin:15px 0 0 33px;background:var(--accent-soft);border-radius:10px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#4f6157;font-size:13px}
  .prompt-actions{display:flex;gap:6px}
  .prompt-actions button{border:0;border-radius:8px;padding:6px 9px;font-size:12px}
  .hide-confirm{background:var(--accent);color:white}
  .keep{background:transparent;color:#66746c}
  .completion-note{margin:10px 0 0 33px;color:var(--muted);font-size:12px}
  .empty{border:1px dashed var(--line-strong);border-radius:14px;padding:46px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}
  .empty strong{display:block;color:#565a55;font-size:15px;margin-bottom:4px;font-weight:600}
  .modal-backdrop{position:fixed;inset:0;background:rgba(30,33,30,.18);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal-backdrop.open{display:flex}
  .modal{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 70px rgba(25,30,26,.17)}
  .modal h2{font-size:18px;margin:0 0 6px}
  .modal p{font-size:13px;color:var(--muted);margin:0 0 14px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .modal-actions button{border:0;border-radius:9px;padding:8px 11px}
  .cancel{background:#f2f3f0;color:#656963}
  .create{background:var(--accent);color:white}
  .status-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;color:var(--muted);margin-left:7px;vertical-align:2px}
  .search-highlight{background:#e8eee9;color:inherit;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  @media (max-width:700px){
    .app{padding:28px 15px 60px}
    .topbar{align-items:stretch;flex-direction:column;gap:16px}
    .search-wrap{width:100%}
    .toolbar{align-items:stretch;flex-direction:column}
    .tools{justify-content:flex-start}
    .task-card{padding:15px 13px}
    .task-top{grid-template-columns:auto 1fr}.created{grid-column:2;margin-top:3px}
    .meta,.subtasks,.hide-prompt,.completion-note{margin-left:32px}
    .subtask{grid-template-columns:auto 1fr}.tiny-time{grid-column:2}
  }
</style>

<style id="tasks-section-divider-style">
.tasks-section-divider{margin:30px 0 16px;border-top:1px solid #d9ddd9;padding-top:16px}
.tasks-section-label{margin:0;font-size:11px;line-height:1;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8a918c}
@media(max-width:640px){.tasks-section-divider{margin-top:24px;padding-top:14px}}
</style>


<style id="mobile-pass-v3">
.utility-toggle{width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:#9a9e98;height:30px;display:flex;align-items:center;justify-content:center;margin:2px 0 4px;font-size:17px;letter-spacing:4px}
.utility-panel{overflow:hidden;transition:max-height .2s ease,opacity .2s ease;max-height:240px;opacity:1}
.utility-panel.collapsed{max-height:0;opacity:0;pointer-events:none}
.tasks-section-divider{display:flex;align-items:center;gap:10px}
.tasks-section-divider:after{content:"";height:1px;background:var(--line);flex:1}
.tasks-section-label{white-space:nowrap}
.clear-due{border:0;background:transparent;color:#9a9e98;font-size:18px;line-height:1;padding:4px 2px}
.edit-title{border:0;background:transparent;color:#8b908a;font-size:18px;line-height:1;padding:2px 4px;margin-left:4px}
.title-edit-input{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 7px;outline:none;background:white}
.category-option-row{display:flex;align-items:center;gap:8px}
.hide-category-btn{border:0;background:transparent;color:#9a9e98;font-size:18px;padding:0 5px}
.confirm-backdrop{display:none;position:fixed;inset:0;background:rgba(20,25,22,.18);z-index:50;align-items:center;justify-content:center;padding:20px}
.confirm-backdrop.open{display:flex}.confirm-box{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:var(--shadow)}
.confirm-box h3{margin:0 0 8px;font-size:17px}.confirm-box p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.45}.confirm-actions{display:flex;justify-content:flex-end;gap:8px}
.confirm-actions button{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:white}.confirm-actions .yes-hide{background:var(--accent);color:white;border-color:var(--accent)}
@media(max-width:640px){
 .app{padding-top:34px}
 .topbar{display:block;margin-bottom:20px}
 .topbar .search-wrap{width:100%;margin-top:18px}
 .utility-panel .topbar-search{display:block}
 .composer{margin-bottom:6px}
 .toolbar{padding-top:8px}
 .task-top{grid-template-columns:auto minmax(0,1fr) auto}
 .created{grid-column:2/-1;white-space:normal}
 .meta{margin-left:32px}
}
</style>


<style id="category-hide-inline-v4">
.category-control{display:flex;align-items:center;gap:5px}
.category-hide-inline{
  border:0;background:transparent;color:#9a9e98;
  font-size:17px;line-height:1;padding:4px 5px;border-radius:8px;
}
.category-hide-inline:hover{background:#f3f4f2;color:#6f756f}
.category-hide-inline[hidden]{display:none}
</style>


<style id="no-completed-strikethrough-v6">
.task-title.done,
.subtask-title.done,
.task-card .done,
.subtask .done {
  text-decoration: none !important;
  color: #8f948f;
}
</style>


<style id="direct-title-edit-v7">
.task-title,.subtask-title{cursor:text;border-radius:6px}
@media(hover:hover){
  .task-title:hover,.subtask-title:hover{background:#f5f6f4}
}
.inline-title-editor{
  width:100%;min-width:0;font:inherit;color:inherit;
  border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:4px 6px;outline:none;
}
.inline-title-editor:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(95,116,104,.08)}
</style>


<style id="hidden-categories-modal-v10">
.hidden-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.hidden-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.hidden-row span{font-size:13px;color:var(--text)}
.unhide-btn{border:1px solid var(--line);background:#fbfbfa;color:#686d67;border-radius:8px;padding:6px 9px;font-size:12px}
.hidden-empty{color:var(--muted);font-size:13px;padding:8px 0}
</style>

<style id="starfish-brand-v11">
.starfish-brand{text-align:center;width:100%}
.starfish-logo{display:block;width:min(205px,52vw);height:auto;margin:0 auto 6px}
.starfish-brand p{text-align:center}
@media(max-width:640px){.starfish-logo{width:min(180px,49vw)}.starfish-brand{padding-top:2px}}
</style>
<style id="new-task-modal-v14">
.new-task-launch{
  width:100%;border:1px solid var(--line);background:var(--surface);color:var(--accent);
  border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;box-shadow:var(--shadow)
}
.new-task-launch:hover{border-color:var(--line-strong)}
.newtask-modal .modal{max-width:520px}
.newtask-grid{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.newtask-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.newtask-field input,.newtask-field select{
  width:100%;border:1px solid var(--line);background:#fbfbfa;border-radius:10px;
  padding:10px 11px;font:inherit;color:var(--text);outline:none
}
.newtask-field input:focus,.newtask-field select:focus{
  border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(95,116,104,.08)
}
.newtask-subtasks{display:flex;flex-direction:column;gap:8px}
.newtask-subrow{display:flex;gap:8px;align-items:center}
.newtask-subrow input{flex:1}
.newtask-remove-sub{border:0;background:transparent;color:#a0a49f;font-size:18px}
.add-another-sub{border:1px solid var(--line);background:#fbfbfa;border-radius:9px;padding:7px 9px;color:#6c716c}
.newtask-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.newtask-actions button{border-radius:9px;padding:9px 13px;font:inherit}
.newtask-cancel{border:1px solid var(--line);background:white;color:var(--text)}
.newtask-create{border:1px solid var(--accent);background:var(--accent);color:white}
@media(max-width:640px){
  .newtask-modal{align-items:flex-end}
  .newtask-modal .modal{
    border-radius:18px 18px 0 0;max-width:none;width:100%;
    padding-bottom:calc(20px + env(safe-area-inset-bottom))
  }
}
</style>


<style id="workflow-polish-v15">
.labeled-utility{
  justify-content:center;gap:7px;letter-spacing:0;font-size:12px;
  color:#8f958f;text-transform:none;
}
.utility-chevron{font-size:15px;line-height:1}
.newtask-category-creator{
  display:flex;gap:8px;margin-top:8px;
}
.newtask-category-creator[hidden]{display:none}
.newtask-category-creator input{flex:1}
.newtask-category-creator button{
  border:1px solid var(--line);background:#fbfbfa;color:var(--accent);
  border-radius:9px;padding:8px 10px;white-space:nowrap;
}
</style>


<style id="search-highlight-v16">
mark.search-highlight{
  background:#f3c987 !important;
  color:inherit;
  padding:0 .08em;
  border-radius:3px;
  box-shadow:inset 0 -1px 0 rgba(194,112,45,.16);
}
</style>

<style id="task-bottom-meta-delete-v18">
.task-utility-row{margin:12px 0 0 33px;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.task-meta-quiet{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted)}
.task-utility-row .category-select,.task-utility-row .date-input{border:0;background:transparent;box-shadow:none;border-radius:6px;padding:3px 4px;color:#858a84;font-size:12px}
.task-utility-row .category-select:hover,.task-utility-row .date-input:hover,.task-utility-row .category-select:focus,.task-utility-row .date-input:focus{background:#f5f6f4}
.task-utility-row .due-chip{gap:2px}
.task-utility-row .due-label{font-size:12px;color:#858a84}
.utility-separator{color:#b5b9b4;font-size:11px}
.delete-task-btn{border:0;background:transparent;color:#9b6f68;font-size:12px;padding:4px 2px}
.delete-task-btn:hover{color:#7f5049}
.delete-confirm{background:#a95649!important;color:white!important;border-color:#a95649!important}
@media(max-width:640px){.task-utility-row{margin-left:32px}}
</style>
<style id="floating-new-task-v19">
.floating-new-task{position:fixed;right:max(18px,calc(env(safe-area-inset-right) + 14px));bottom:max(20px,calc(env(safe-area-inset-bottom) + 16px));z-index:35;width:56px;height:56px;border:0;border-radius:50%;background:#d97936;color:white;font-size:30px;font-weight:300;line-height:1;box-shadow:0 5px 18px rgba(74,62,50,.20);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(10px) scale(.94);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.floating-new-task.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.floating-new-task:active{transform:scale(.95)}
</style>
<style id="aging-overdue-pin-v20">
.tasks-section-divider{display:block!important}
.task-age-filters{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.age-filter{border:0;background:transparent;padding:0;font-size:11px;line-height:1;font-weight:600;letter-spacing:.10em;color:#969b96}
.age-filter.active{color:#555b56}
.overdue-filter.has-overdue{color:#c56f36}
.overdue-filter.active.has-overdue{color:#b95f28}
.is-overdue>.task-top>.parent-check:not(:checked){border-color:#d97936!important;box-shadow:0 0 0 1px rgba(217,121,54,.08)}
.overdue-due .due-label,.overdue-due .date-input{color:#c56f36!important}
.task-row-actions{display:flex;align-items:center;gap:12px}
.pin-task-btn{border:0;background:transparent;color:#7f8780;font-size:12px;padding:4px 2px}
.pin-task-btn:hover{color:#555b56}
@media(max-width:430px){.task-age-filters{gap:12px}.age-filter{font-size:10px;letter-spacing:.07em}}
</style>
<style id="clean-mobile-card-v21">
.task-card{position:relative}
.task-menu-btn{position:absolute;right:18px;top:18px;border:0;background:transparent;color:#929792;font-size:16px;letter-spacing:2px;padding:4px}
.task-due-display{margin:10px 0 0 33px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:#858a84}
.task-due-display.overdue-due-display{color:#c56f36}
.detail-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px}
.detail-row label{font-size:13px;color:#777d78}
.detail-row select,.detail-row input{max-width:210px;border:1px solid var(--line);background:#fbfbfa;border-radius:9px;padding:8px;font:inherit}
.detail-created{margin-top:15px;font-size:12px;color:#999e99}
.detail-actions{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.detail-actions button{border:0;background:transparent;color:#737a74;padding:4px}
#detailDelete{color:#9b6f68}
</style>
<style id="v22-invite-pin">
.task-status-actions{position:absolute;right:16px;top:17px;display:flex;align-items:center;gap:8px}
.task-status-actions .task-menu-btn{position:static!important;right:auto!important;top:auto!important}
.pin-status-icon{color:#718078;font-size:15px;line-height:1}
.invite-status-icon{color:#d97936;font-size:13px;line-height:1;font-weight:600}
.detail-row select{width:min(210px,60%)}
</style>
<style id="v23-refinement">
:root{--v23-forest:#356b45}
.pin-svg{width:16px;height:16px;display:block}
.pin-status-icon{color:var(--v23-forest);display:inline-flex;align-items:center}
.floating-new-task{left:50%!important;right:auto!important;background:var(--v23-forest)!important;color:#fff!important}
.floating-new-task.visible{transform:translateX(-50%) translateY(0) scale(1)!important}
.floating-new-task:not(.visible){transform:translateX(-50%) translateY(10px) scale(.94)!important}
.task-details-box{padding:20px;max-width:430px}
.details-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.details-head h3{margin:0;font-size:20px}
.details-close{border:0;background:transparent;font-size:25px;line-height:1}
.details-summary-row{width:100%;border:0;background:transparent;padding:13px 0;display:flex;justify-content:space-between;align-items:center;text-align:left;font:inherit;color:var(--text)}
.details-value{display:flex;gap:10px;align-items:center;color:#59655e}.details-value-text{color:#59655e}
.details-hidden-control{position:fixed!important;left:-9999px!important;top:-9999px!important;width:1px!important;height:1px!important;opacity:.01!important}
.details-divider{height:1px;background:var(--line);margin:4px 0 8px}
.details-action-row{width:100%;border:0;background:transparent;padding:12px 0;display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--text)}
.details-action-icon{width:22px;display:flex;justify-content:center;color:#69736c}
.details-delete-row,.details-delete-row .details-action-icon{color:#a45d55}
</style>

<style id="v23-functionality-fix">
.details-editor{padding:0 0 10px}
.details-editor[hidden]{display:none}
.details-editor select,
.details-editor input{
  width:100%;
  border:1px solid var(--line);
  background:#fbfbfa;
  border-radius:9px;
  padding:9px 10px;
  font:inherit;
  color:var(--text);
}
.details-due-edit-row,
.details-inline-create{
  display:flex;
  gap:8px;
  align-items:center;
}
.details-due-edit-row input,
.details-inline-create input{flex:1}

<script>
const STORAGE_KEY = 'still-todo-prototype-v1';
const seed = {
  categories:['Property Management','CVFC','Home'],
  tasks:[
    {id:crypto.randomUUID(),title:'Prepare fall registration',createdAt:new Date(Date.now()-1000*60*48).toISOString(),dueDate:'',category:'CVFC',parentComplete:false,parentCompletedAt:null,hidden:false,completedAt:null,subtasks:[
      {id:crypto.randomUUID(),title:'Update registration page',createdAt:new Date(Date.now()-1000*60*42).toISOString(),complete:true,completedAt:new Date(Date.now()-1000*60*18).toISOString()},
      {id:crypto.randomUUID(),title:'Email coaches',createdAt:new Date(Date.now()-1000*60*40).toISOString(),complete:false,completedAt:null},
      {id:crypto.randomUUID(),title:'Create Facebook post',createdAt:new Date(Date.now()-1000*60*37).toISOString(),complete:false,completedAt:null}
    ]},
    {id:crypto.randomUUID(),title:'Call landscaper about Maple St',createdAt:new Date(Date.now()-1000*60*12).toISOString(),dueDate:'',category:null,parentComplete:false,parentCompletedAt:null,hidden:false,completedAt:null,subtasks:[]}
  ]
};

let state = load();
state.hiddenCategories = state.hiddenCategories || [];
let view = 'current';
let ageView = 'all';
let categoryTarget = null;

function load(){
  try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(parsed && parsed.tasks) return parsed;}catch(e){}
  localStorage.setItem(STORAGE_KEY,JSON.stringify(seed)); return structuredClone(seed);
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function escapeRegExp(s=''){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function highlight(s='',q=''){
  if(!q)return esc(s);
  const re=new RegExp(`(${escapeRegExp(q)})`,'ig');
  return String(s).split(re).map((part,i)=>i%2?`<mark class="search-highlight">${esc(part)}</mark>`:esc(part)).join('');
}
function fmt(iso){if(!iso)return ''; return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(iso));}
function fmtDate(date){if(!date)return ''; const [y,m,d]=date.split('-').map(Number); return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(y,m-1,d));}
function isFullyComplete(t){return t.parentComplete && t.subtasks.every(s=>s.complete);}
function findTask(id){return state.tasks.find(t=>t.id===id);}
function getInviteNames(){try{return JSON.parse(localStorage.getItem('starfish_invite_names')||'[]')}catch(e){return []}}
function saveInviteName(name){const n=(name||'').trim();if(!n)return;const a=getInviteNames();if(!a.some(x=>x.toLowerCase()===n.toLowerCase())){a.push(n);localStorage.setItem('starfish_invite_names',JSON.stringify(a));}}
function inviteOptions(selected=''){const a=[...new Set([...getInviteNames(),...(selected?[selected]:[])])];return '<option value="">No one</option>'+a.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')+'<option value="__new__">+ Invite someone</option>';}

function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isOverdue(t){return !t.hidden && !!t.dueDate && t.dueDate < localToday() && !isFullyComplete(t);}
function isOldTask(t){return !t.hidden && (Date.now()-new Date(t.createdAt).getTime()) >= 7*24*60*60*1000 && !isFullyComplete(t);}

function syncListOptionSummaries(){
  const sort=document.getElementById('sortBy');
  const sortSummary=document.getElementById('sortSummary');
  if(sort&&sortSummary)sortSummary.textContent=sort.options[sort.selectedIndex]?.text||'Newest';
  const viewSummary=document.getElementById('viewSummary');
  if(viewSummary)viewSummary.textContent=view==='completed'?'Completed':'Current';
}
function render(){
  syncListOptionSummaries();
  renderFilters();
  const q=document.getElementById('search').value.trim().toLowerCase();
  const cat=document.getElementById('categoryFilter').value;
  const sort=document.getElementById('sortBy').value;
  let tasks=[...state.tasks];

  if(q){
    tasks=tasks.filter(t=>t.title.toLowerCase().includes(q)||t.subtasks.some(s=>s.title.toLowerCase().includes(q))||(t.category||'').toLowerCase().includes(q));
  }else{
    tasks=tasks.filter(t=>view==='current'?!t.hidden:t.hidden);
  }
  if(cat!=='all') tasks=tasks.filter(t=>cat==='none'?!t.category:t.category===cat);

  const currentTasks=state.tasks.filter(t=>!t.hidden);
  const oldCount=currentTasks.filter(isOldTask).length;
  const overdueCount=currentTasks.filter(isOverdue).length;
  document.querySelector('[data-age-view="all"]').textContent=`TASKS (${currentTasks.length})`;
  document.querySelector('[data-age-view="old"]').textContent=`7+ DAYS (${oldCount})`;
  document.querySelector('[data-age-view="overdue"]').textContent=`OVERDUE (${overdueCount})`;
  document.querySelectorAll('.age-filter').forEach(b=>b.classList.toggle('active',b.dataset.ageView===ageView));
  document.querySelector('.overdue-filter').classList.toggle('has-overdue',overdueCount>0);
  if(!q && view==='current'){
    if(ageView==='old') tasks=tasks.filter(isOldTask);
    if(ageView==='overdue') tasks=tasks.filter(isOverdue);
  }

  tasks.sort((a,b)=>{
    if(!!a.pinned!==!!b.pinned) return a.pinned?-1:1;
    if(sort==='created-asc') return new Date(a.createdAt)-new Date(b.createdAt);
    if(sort==='category') return (a.category||'zzzz').localeCompare(b.category||'zzzz') || new Date(b.createdAt)-new Date(a.createdAt);
    if(sort==='due') return (a.dueDate||'9999-12-31').localeCompare(b.dueDate||'9999-12-31');
    if(sort==='completed-desc') return new Date(b.completedAt||0)-new Date(a.completedAt||0);
    return new Date(b.createdAt)-new Date(a.createdAt);
  });

  const list=document.getElementById('taskList');
  if(!tasks.length){
    list.innerHTML=`<div class="empty"><strong>${q?'No matching tasks':view==='current'?'Nothing needs your attention.':'No completed tasks yet.'}</strong>${q?'Try another search term.':view==='current'?'Add a task when something comes up.':'Finished tasks you hide will live here.'}</div>`;
    return;
  }
  list.innerHTML=tasks.map(t=>taskHtml(t,q)).join('');
  bindTaskEvents();
}

function taskHtml(t,q){
  const done=t.parentComplete;
  const fully=isFullyComplete(t);
  const categoryIsHidden=!!(t.category && !state.categories.includes(t.category));
  const catOptions=[
    categoryIsHidden
      ? `<option value="__current_hidden__" selected disabled>${esc(t.category)}</option>`
      : '<option value="">Category</option>',
    ...state.categories.map(c=>`<option ${t.category===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`),
    '<option value="__create__">+ Create new…</option>',
    '<option value="__hidden__">See hidden…</option>'
  ].join('');
  const searchStatus=q?`<span class="status-pill">${t.hidden?'Completed':'Current'}</span>`:'';
  const overdue=isOverdue(t);
  return `<article class="task-card ${q&&t.hidden?'search-completed':''} ${overdue?'is-overdue':''}" data-task="${t.id}">
    <div class="task-top">
      <input class="check parent-check" type="checkbox" ${done?'checked':''} aria-label="Complete task">
      <div class="task-title ${done?'done':''}">${highlight(t.title,q)}${searchStatus}</div>
      
    </div>
    ${(t.subtasks.length||t.showSubtaskComposer)?`<div class="subtasks">
      ${t.subtasks.map(st=>`<div class="subtask" data-subtask="${st.id}">
        <input class="check sub-check" type="checkbox" ${st.complete?'checked':''} aria-label="Complete sub-task">
        <div class="subtask-title ${st.complete?'done':''}">${highlight(st.title,q)}</div>
      </div>`).join('')}
      <form class="subtask-composer"><input class="subtask-input" placeholder="Add a sub-task…" autocomplete="off"><button class="subtask-add" type="submit">Add</button></form>
    </div>`:''}
    ${t.dueDate?`<div class="task-due-display ${overdue?'overdue-due-display':''}">${overdue?'Overdue':'Due'} ${new Date(t.dueDate+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`:''}
    <div class="task-status-actions">
      ${t.invitedUser?`<span class="invite-status-icon" title="Invite pending" aria-label="Invite pending"><svg class="person-svg" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="7" r="4" fill="currentColor"></circle>
  <path d="M5 21c.5-5 3.1-8 7-8s6.5 3 7 8H5z" fill="currentColor"></path>
</svg></span>`:''}
      ${t.pinned?`<span class="pin-status-icon" title="Pinned" aria-label="Pinned"><svg class="pin-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-1.4 5.2 2.9 3.1v1.7H13v7l-1 1.5-1-1.5v-7H6.5v-1.7l2.9-3.1L8 3z" fill="currentColor"/></svg></span>`:''}
      <button class="task-menu-btn" type="button" aria-label="Task details">•••</button>
    </div>
    ${fully&&!t.hidden?`<div class="hide-prompt"><span>Everything is checked. <strong>Ready to hide?</strong></span><div class="prompt-actions"><button class="keep" type="button">Keep visible</button><button class="hide-confirm" type="button">Hide</button></div></div>`:''}
    ${t.hidden?`<div class="completion-note">Completed ${fmt(t.completedAt)} · Uncheck the task or any sub-task to return it to Current.</div>`:''}
  </article>`;
}

function renderFilters(){
  const sel=document.getElementById('categoryFilter'); const current=sel.value;
  sel.innerHTML='<option value="all">All categories</option><option value="none">No category</option>'+state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if([...sel.options].some(o=>o.value===current))sel.value=current;
  const summary=document.getElementById('filterSummary');
  if(summary){
    summary.textContent=sel.value==='all'?'All':sel.value==='none'?'No category':sel.value;
  }
  const hs=document.getElementById('hideCategorySelect');if(hs)hs.innerHTML=state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}

function bindTaskEvents(){
  document.querySelectorAll('.task-card').forEach(card=>{
    const id=card.dataset.task, t=findTask(id);
    card.querySelector('.parent-check').addEventListener('change',e=>{
      t.parentComplete=e.target.checked; t.parentCompletedAt=e.target.checked?new Date().toISOString():null;
      if(!e.target.checked && t.hidden){t.hidden=false;t.completedAt=null;view='current';setActiveTab();}
      save();render();
    });
    const cardCategory=card.querySelector('.category-select'); if(cardCategory) cardCategory.addEventListener('change',e=>{
      if(e.target.value==='__create__'){categoryTarget=id;openCategoryModal();e.target.value=t.category||'';}
      else if(e.target.value==='__hidden__'){openHiddenCategories();e.target.value=categoryIsHidden?'__current_hidden__':(t.category||'');}
      else {t.category=e.target.value||null;save();render();}
    });
    const inlineHide=card.querySelector('.category-hide-inline');
    if(inlineHide) inlineHide.addEventListener('click',()=>{
      if(!t.category || !state.categories.includes(t.category)) return;
      pendingHideCategory=t.category;
      document.getElementById('hideCategoryText').textContent=`Are you sure you want to hide “${pendingHideCategory}”? Existing tasks using this category will not be changed.`;
      document.getElementById('hideCategoryConfirm').classList.add('open');
    });
    const cardDate=card.querySelector('.date-input'); if(cardDate) cardDate.addEventListener('change',e=>{t.dueDate=e.target.value;save();render();});
    const clearDue=card.querySelector('.clear-due'); if(clearDue) clearDue.addEventListener('click',()=>{t.dueDate='';save();render();});
    const menuBtn=card.querySelector('.task-menu-btn');
    if(menuBtn) menuBtn.addEventListener('click',()=>openTaskDetails(id));
    function beginInlineEdit(el, getValue, setValue){
      if(el.querySelector('input')) return;
      const old=getValue();
      const input=document.createElement('input');
      input.className='inline-title-editor';
      input.value=old;
      el.replaceChildren(input);
      input.focus();
      input.select();
      let finished=false;
      const finish=(saveIt)=>{
        if(finished)return;finished=true;
        const val=input.value.trim();
        if(saveIt && val){setValue(val);save();}
        render();
      };
      input.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'){ev.preventDefault();finish(true);}
        if(ev.key==='Escape'){ev.preventDefault();finish(false);}
      });
      input.addEventListener('blur',()=>finish(true));
    }
    card.querySelector('.task-title').addEventListener('click',e=>{
      beginInlineEdit(e.currentTarget,()=>t.title,v=>t.title=v);
    });
    card.querySelectorAll('.subtask').forEach(row=>{
      const title=row.querySelector('.subtask-title');
      title.addEventListener('click',()=>{
        const st=t.subtasks.find(x=>x.id===row.dataset.subtask);
        beginInlineEdit(title,()=>st.title,v=>st.title=v);
      });
    });
    const subtaskComposer=card.querySelector('.subtask-composer'); if(subtaskComposer) subtaskComposer.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');const title=input.value.trim();if(!title)return;t.subtasks.push({id:crypto.randomUUID(),title,createdAt:new Date().toISOString(),complete:false,completedAt:null});input.value='';save();render();});
    card.querySelectorAll('.subtask').forEach(row=>row.querySelector('.sub-check').addEventListener('change',e=>{
      const s=t.subtasks.find(x=>x.id===row.dataset.subtask);s.complete=e.target.checked;s.completedAt=e.target.checked?new Date().toISOString():null;
      if(!e.target.checked && t.hidden){t.hidden=false;t.completedAt=null;view='current';setActiveTab();}
      save();render();
    }));
    const hide=card.querySelector('.hide-confirm');if(hide)hide.addEventListener('click',()=>{t.hidden=true;t.completedAt=new Date().toISOString();save();render();});
    const keep=card.querySelector('.keep');if(keep)keep.addEventListener('click',()=>{ /* intentionally remains visible */ });
  });
}

document.getElementById('saveNewTaskCategory').addEventListener('click',()=>{
  const input=document.getElementById('newTaskCategoryName');
  const name=input.value.trim();
  if(!name){input.focus();return;}
  const existingActive=state.categories.find(c=>c.toLowerCase()===name.toLowerCase());
  const existingHidden=state.hiddenCategories.find(c=>c.toLowerCase()===name.toLowerCase());
  if(existingActive){
    document.getElementById('newTaskCategory').value=existingActive;
  }else if(existingHidden){
    state.hiddenCategories=state.hiddenCategories.filter(c=>c!==existingHidden);
    state.categories.push(existingHidden);
    save();
    refreshNewTaskCategoryOptions();
    document.getElementById('newTaskCategory').value=existingHidden;
  }else{
    state.categories.push(name);
    save();
    refreshNewTaskCategoryOptions();
    document.getElementById('newTaskCategory').value=name;
  }
  document.getElementById('newTaskCategoryCreator').hidden=true;
  input.value='';
});
document.getElementById('newTaskCategoryName').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();document.getElementById('saveNewTaskCategory').click();}
});

document.getElementById('createNewTask').addEventListener('click',()=>{
  const title=document.getElementById('newTaskTitle').value.trim();
  if(!title){document.getElementById('newTaskTitle').focus();return;}
  const now=new Date().toISOString();
  const subtasks=[...document.querySelectorAll('.newtask-sub-input')]
    .map(i=>i.value.trim()).filter(Boolean)
    .map(st=>({id:crypto.randomUUID(),title:st,createdAt:now,complete:false,completedAt:null}));
  state.tasks.unshift({
    id:crypto.randomUUID(),
    title,
    createdAt:now,
    dueDate:document.getElementById('newTaskDue').value||'',
    category:(document.getElementById('newTaskCategory').value==='__create_new__'?'':document.getElementById('newTaskCategory').value)||null,
    invitedUser:document.getElementById('newTaskInvite').dataset.confirmed||null,
    inviteStatus:document.getElementById('newTaskInvite').dataset.confirmed?'pending':null,
    parentComplete:false,
    parentCompletedAt:null,
    hidden:false,
    completedAt:null,
    subtasks
  });
  view='current';
  setActiveTab();
  save();
  closeNewTaskModal();
  render();
});

});

let detailTaskId=null;
function openTaskDetails(id){
  const t=findTask(id); if(!t)return; detailTaskId=id;

  const catSel=document.getElementById('detailCategory');
  const cats=[...new Set([...state.categories,...(t.category?[t.category]:[])])];
  catSel.innerHTML='<option value="">No category</option>'+
    cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')+
    '<option value="__new__">+ Create New Category</option>';
  catSel.value=t.category||'';

  document.getElementById('detailDue').value=t.dueDate||'';

  const inviteSel=document.getElementById('detailInvite');
  const activeInvite=(t.inviteStatus==='pending'||t.inviteStatus==='accepted')?t.invitedUser:'';
  inviteSel.innerHTML=inviteOptions(activeInvite||'');
  inviteSel.value=activeInvite||'';
  inviteSel.disabled=!!activeInvite;
  document.getElementById('detailSendInvite').hidden=true;
  document.getElementById('detailCancelInvite').hidden=!activeInvite;

  document.getElementById('detailCategoryText').textContent=t.category||'None';
  document.getElementById('detailDueText').textContent=t.dueDate
    ? new Date(t.dueDate+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
    : 'None';
  document.getElementById('detailInviteText').textContent=activeInvite?`${activeInvite} · ${t.inviteStatus==='accepted'?'Accepted':'Pending'}`:'No one';
  document.getElementById('detailCreated').textContent=
    new Date(t.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  document.querySelector('.detail-pin-label').textContent=t.pinned?'Unpin task':'Pin task';
  document.getElementById('detailAddSubtask').hidden=t.subtasks.length>0;

  document.getElementById('detailCategoryEditor').hidden=true;
  document.getElementById('detailDueEditor').hidden=true;
  document.getElementById('detailInviteEditor').hidden=true;
  document.getElementById('detailInviteCreator').hidden=true;
  document.getElementById('detailInviteName').value='';

  document.getElementById('taskDetailsModal').classList.add('open');
}
function closeTaskDetails(){document.getElementById('taskDetailsModal').classList.remove('open');detailTaskId=null;}
document.getElementById('detailClose').addEventListener('click',closeTaskDetails);
document.getElementById('taskDetailsModal').addEventListener('click',e=>{if(e.target.id==='taskDetailsModal')closeTaskDetails();});

  const target=document.getElementById(id);

  target.hidden=!target.hidden;
}

document.getElementById('detailCategory').addEventListener('change',e=>{
  const t=findTask(detailTaskId); if(!t)return;
  if(e.target.value==='__new__'){
    const name=prompt('New category name');
    if(name&&name.trim()){
      const clean=name.trim();
      const hidden=state.hiddenCategories.find(c=>c.toLowerCase()===clean.toLowerCase());
      const active=state.categories.find(c=>c.toLowerCase()===clean.toLowerCase());
      if(hidden){
        state.hiddenCategories=state.hiddenCategories.filter(c=>c!==hidden);
        if(!state.categories.includes(hidden))state.categories.push(hidden);
        t.category=hidden;
      }else if(active){
        t.category=active;
      }else{
        state.categories.push(clean);
        t.category=clean;
      }
      save();
    }
  }else{
    t.category=e.target.value||null;
    save();
  }
  render();
  openTaskDetails(t.id);
});

document.getElementById('detailDue').addEventListener('change',e=>{
  const t=findTask(detailTaskId); if(!t)return;
  t.dueDate=e.target.value||'';
  save(); render(); openTaskDetails(t.id);
});
document.getElementById('detailDueClear').addEventListener('click',()=>{

});

function renderHiddenCategories(){
  const wrap=document.getElementById('hiddenCategoriesList');
  if(!state.hiddenCategories.length){
    wrap.innerHTML='<div class="hidden-empty">No hidden categories.</div>';
    return;
  }
  wrap.innerHTML=state.hiddenCategories.map(c=>`<div class="hidden-row"><span>${esc(c)}</span><button class="unhide-btn" type="button" data-category="${esc(c)}">Unhide</button></div>`).join('');
  wrap.querySelectorAll('.unhide-btn').forEach(btn=>btn.addEventListener('click',()=>{
    const c=btn.dataset.category;
    state.hiddenCategories=state.hiddenCategories.filter(x=>x!==c);
    if(!state.categories.includes(c)) state.categories.push(c);
    save();
    renderHiddenCategories();
    render();
  }));
}
